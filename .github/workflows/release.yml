name: Release

# Push a tag `vX.Y.Z` or `vX.Y.Z-beta.N` that matches apps/cli/package.json. npm authenticates this
# workflow through trusted publishing (npmjs.com → vibestart-cli → Settings → Trusted publisher:
# VinkyDev/vibestart, workflow `release.yml`), so no token or one-time password is involved.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: .node-version
          cache: true
      - run: vp install
      - name: Tag matches the package version
        run: test "v$(node -p "require('./apps/cli/package.json').version")" = "$VERSION"
      - run: vp run ready
      - run: vp run stacks restore
        env:
          GH_TOKEN: ${{ github.token }}
      - run: vp run stacks check
      # `vp pm pack` is pnpm's pack: it replaces `catalog:` and `workspace:`, which `npm publish` would not.
      - name: Pack
        working-directory: apps/cli
        run: |
          vp pack
          vp pm pack --pack-destination "$RUNNER_TEMP/pack"
      # A version with a prerelease suffix goes to `beta`, so `latest` only ever moves to a stable release.
      - name: Publish
        run: |
          case "$VERSION" in *-*) tag=beta ;; *) tag=latest ;; esac
          npm publish "$RUNNER_TEMP"/pack/*.tgz --tag "$tag" --access public
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$VERSION" in *-*) flag=--prerelease ;; *) flag= ;; esac
          gh release create "$VERSION" .verification/artifact/report.json --verify-tag --title "$VERSION" --generate-notes $flag
