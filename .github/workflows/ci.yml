name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: Refresh dependencies and rerun every verification
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      pending: ${{ steps.plan.outputs.pending }}
      image: ${{ steps.plan.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: .node-version
          cache: true
      - run: vp install
      - run: vp run ready
      - run: vp run stacks restore
        env:
          GH_TOKEN: ${{ github.token }}
      - id: plan
        run: vp run stacks plan $FORCE
        env:
          FORCE: ${{ (github.event_name == 'schedule' || inputs.force == true) && '--force' || '' }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: verification-plan
          overwrite: true
          retention-days: 30
          include-hidden-files: true
          path: |
            .verification/plan.json
            .verification/artifact
            .verification/changes.txt
            .verification/diffs

  verify:
    if: needs.plan.outputs.pending == 'true'
    needs: plan
    name: verify (${{ matrix.name }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 360
    container:
      image: ${{ matrix.platform == 'ubuntu-24.04' && needs.plan.outputs.image || '' }}
      options: --init --ipc=host
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    services:
      postgres:
        image: ${{ matrix.platform == 'ubuntu-24.04' && 'postgres:18' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: .node-version
          cache: true
      - run: vp env install bun@1.4.2
      - run: bun --version
        env:
          VP_BUN_VERSION: 1.4.2
      - if: runner.os == 'Windows'
        uses: ./.github/actions/setup-postgres
        id: postgres
        timeout-minutes: 15
      - run: vp install
      - if: runner.os == 'Windows'
        uses: ./.github/actions/setup-playwright
        timeout-minutes: 10
      - uses: actions/download-artifact@v8.0.1
        with:
          name: verification-plan
          path: .verification
      - run: vp run stacks run "$BATCH"
        env:
          GH_TOKEN: ${{ github.token }}
          VP_BUN_VERSION: 1.4.2
          BATCH: ${{ matrix.name }}
          CI_CONTAINER_IMAGE: ${{ matrix.platform == 'ubuntu-24.04' && needs.plan.outputs.image || '' }}
          STACKS_POSTGRES_URL: ${{ matrix.platform == 'ubuntu-24.04' && 'postgres://postgres:postgres@postgres:5432/postgres' || steps.postgres.outputs.connection-uri }}
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: results-${{ matrix.name }}
          overwrite: true
          retention-days: 30
          include-hidden-files: true
          path: |
            .verification/results
            .verification/artifact/locks
      - if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: logs-${{ matrix.name }}
          overwrite: true
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            .verification/logs
            .verification/projects/*/apps/web/test-results/**
            .verification/projects/*/apps/web/playwright-report/**
            .verification/projects/*/apps/web/.e2e/**

  ci:
    if: always()
    needs: [plan, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - run: test "$PLAN" = success && { test "$VERIFY" = success || test "$VERIFY" = skipped; }
        env:
          PLAN: ${{ needs.plan.result }}
          VERIFY: ${{ needs.verify.result }}
        id: jobs
        continue-on-error: true
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: .node-version
          cache: true
      - run: vp install
      - if: needs.plan.result == 'success'
        uses: actions/download-artifact@v8.0.1
        with:
          name: verification-plan
          path: .verification
      - if: needs.verify.result != 'skipped' && needs.plan.result == 'success'
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: results-*
          merge-multiple: true
          path: .verification
      - if: needs.plan.result == 'success'
        run: vp run stacks report
      - if: always() && needs.plan.result == 'success'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: verification
          overwrite: true
          retention-days: 30
          path: .verification/artifact
      - run: test "$JOBS" = success
        env:
          JOBS: ${{ steps.jobs.outcome }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: verification-web
          overwrite: true
          retention-days: 30
          path: packages/integrations/verification/current.json
      - run: vp run --filter vibestart-cli build
      - run: vp run --filter @vibestart/web build
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: verified-builds
          overwrite: true
          retention-days: 30
          path: |
            apps/cli/dist
            apps/web/dist
