name: Prepare Playwright
description: Install Chromium using the catalog version, npm's verified download cache and native retries.
runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: node --input-type=module -e "import { catalog } from './packages/integrations/src/catalog.ts'; console.log('range=' + catalog.toolchain['@playwright/test']);" >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # npm verifies this content-addressed cache; do not cache npx's node_modules.
        path: ${{ runner.temp }}/playwright-npm/_cacache
        key: playwright-npm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/integrations/src/catalog.ts', '.github/actions/setup-playwright/action.yml') }}
    - shell: bash
      env:
        PLAYWRIGHT_VERSION: ${{ steps.version.outputs.range }}
        npm_config_cache: ${{ runner.temp }}/playwright-npm
        npm_config_fetch_retries: "2"
        npm_config_fetch_retry_factor: "2"
        npm_config_fetch_retry_mintimeout: "5000"
        npm_config_fetch_retry_maxtimeout: "15000"
        npm_config_fetch_timeout: "60000"
        PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "60000"
      run: npx --yes "playwright@$PLAYWRIGHT_VERSION" install --with-deps chromium
    - if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/playwright-npm/_cacache
        key: ${{ steps.cache.outputs.cache-primary-key }}
