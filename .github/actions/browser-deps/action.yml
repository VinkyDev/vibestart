name: Browser system dependencies
description: Install Chromium system libraries on Ubuntu runners
runs:
  using: composite
  steps:
    - name: Add an independent mirror to the runner's Ubuntu mirrors
      shell: bash
      run: |
        printf '%s\n' 'https://mirrors.kernel.org/ubuntu/' | sudo tee -a /etc/apt/apt-mirrors.txt
    - run: vp exec playwright install-deps chromium
      shell: bash
      working-directory: apps/web
