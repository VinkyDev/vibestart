packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  node-diff3: ^3.2.1
  # toolchain
  "@shadcn/lint": ^0.2.0
  "@types/node": ^24.19.1
  knip: ^6.40.0
  # Must match the oxfmt that vite-plus bundles, so generated files pass `vp check`.
  oxfmt: 0.72.0
  typescript: ^7.0.2
  ultracite: ^7.12.4
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0

  # cli
  "@clack/prompts": ^1.8.1
  citty: ^0.2.2
  execa: ^10.1.0
  jsonc-parser: ^3.3.1

  # generator
  "@types/semver": ^7.8.0
  es-toolkit: ^1.52.0
  semver: ^7.8.5
  zod: ^4.6.5

  # web
  "@inlang/paraglide-js": ^2.26.0
  "@inlang/paraglide-js-react": ^1.0.3
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-router": ^1.170.41
  "@tanstack/router-plugin": ^1.168.42
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.2
  motion: ^14.0.0
  oxc-transform-react: ^0.153.0
  react: ^19.3.0
  react-dom: ^19.3.0
  shiki: ^4.5.0
  tailwindcss: ^4.3.3
  wrangler: ^4.148.0

  # docs
  "@types/mdx": ^2.0.14
  fumadocs-core: ^16.16.2
  fumadocs-mdx: ^15.4.6

  # ui
  "@base-ui/react": ^1.8.0
  "@fontsource-variable/instrument-sans": ^5.3.0
  "@fontsource-variable/noto-serif-sc": ^5.3.0
  "@fontsource/dm-mono": ^5.3.0
  "@fontsource/instrument-serif": ^5.3.0
  class-variance-authority: ^0.7.1
  cn: ^0.4.0
  lucide-react: ^1.52.0
  shadcn: ^4.21.3
  tw-animate-css: ^1.4.0

overrides:
  vite@*: "catalog:"

allowBuilds:
  esbuild: false
  workerd: false

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

minimumReleaseAgeExclude:
  - "@shikijs/core@4.5.0"
  - "@shikijs/engine-javascript@4.5.0"
  - "@shikijs/engine-oniguruma@4.5.0"
  - "@shikijs/langs@4.5.0"
  - "@shikijs/primitive@4.5.0"
  - "@shikijs/themes@4.5.0"
  - "@shikijs/types@4.5.0"
  - "@tanstack/react-router@1.170.41"
  - "@tanstack/router-core@1.171.34"
  - "@tanstack/router-generator@1.167.40"
  - "@tanstack/router-plugin@1.168.42"
  - knip@6.39.0 || 6.40.0
  - shiki@4.5.0
  - "@types/node@24.19.1"
  - framer-motion@14.0.0
  - fumadocs-core@16.15.18 || 16.16.1
  - fumadocs-mdx@15.4.6
  - lucide-react@1.50.0 || 1.52.0
  - motion-dom@14.0.0
  - motion-utils@14.0.0
  - motion@14.0.0
  - "@inlang/paraglide-js@2.26.0"
  - "@inlang/sdk@3.1.0"
  - "@lix-js/sdk@0.19.0"
  - "@shadcn/registry@0.1.2"
  - "@voidzero-dev/vite-plus-core@1.1.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.1.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.1.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.1.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.1.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.1.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.1.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.1.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.1.0"
  - execa@10.1.0
  - miniflare@5.20261006.0-alpha
  - shadcn@4.21.3
  - vite-plus@1.1.0
  - wrangler@4.148.0
