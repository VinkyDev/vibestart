packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  node-diff3: ^4.0.0
  # agents
  best-agents-md: 0.1.2

  # toolchain
  "@shadcn/lint": ^0.2.5
  "@types/node": ^26.6.6
  knip: ^6.48.0
  # Must match the oxfmt that vite-plus bundles, so generated files pass `vp check`.
  oxfmt: 0.79.0
  typescript: ^7.0.2
  ultracite: ^8.3.1
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
  vite-plus: 1.8.0

  # cli
  "@clack/prompts": ^1.9.0
  citty: ^0.2.2
  execa: ^10.2.1
  jsonc-parser: ^3.3.1

  # generator
  "@types/semver": ^7.8.0
  es-toolkit: ^1.53.2
  semver: ^7.8.6
  zod: ^4.6.7

  # web
  "@playwright/test": ^1.65.1
  "@inlang/paraglide-js": ^3.2.2
  "@inlang/paraglide-js-react": ^1.0.4
  "@tailwindcss/vite": ^4.3.5
  "@tanstack/react-router": ^1.170.46
  "@tanstack/router-plugin": ^1.169.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.3.0
  motion: ^14.14.0
  oxc-transform-react: ^0.158.0
  react: 19.3.0
  react-dom: 19.3.0
  shiki: ^4.6.0
  tailwindcss: ^4.3.5
  wrangler: ^4.167.0

  # docs
  "@types/mdx": ^2.0.14
  fumadocs-core: ^16.19.7
  fumadocs-mdx: ^15.6.4

  # ui
  "@base-ui/react": ^1.9.0
  "@fontsource-variable/instrument-sans": ^5.3.0
  "@fontsource-variable/noto-serif-sc": ^5.3.1
  "@fontsource/dm-mono": ^5.3.0
  "@fontsource/instrument-serif": ^5.3.0
  class-variance-authority: ^0.7.1
  cn: ^0.5.2
  lucide-react: ^1.79.0
  shadcn: ^4.23.0
  tw-animate-css: ^1.4.0

overrides:
  vite@*: "catalog:"

allowBuilds:
  esbuild: false
  workerd: false

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

minimumReleaseAgeExcludePrune: true

minimumReleaseAgeExclude:
  - "@clack/core@1.6.0"
  - "@clack/prompts@1.9.0"
  - "@oxc-transform-react/binding-android-arm-eabi@0.158.0"
  - "@oxc-transform-react/binding-android-arm64@0.158.0"
  - "@oxc-transform-react/binding-darwin-arm64@0.158.0"
  - "@oxc-transform-react/binding-darwin-x64@0.158.0"
  - "@oxc-transform-react/binding-freebsd-x64@0.158.0"
  - "@oxc-transform-react/binding-linux-arm-gnueabihf@0.158.0"
  - "@oxc-transform-react/binding-linux-arm-musleabihf@0.158.0"
  - "@oxc-transform-react/binding-linux-arm64-gnu@0.158.0"
  - "@oxc-transform-react/binding-linux-arm64-musl@0.158.0"
  - "@oxc-transform-react/binding-linux-ppc64-gnu@0.158.0"
  - "@oxc-transform-react/binding-linux-riscv64-gnu@0.158.0"
  - "@oxc-transform-react/binding-linux-riscv64-musl@0.158.0"
  - "@oxc-transform-react/binding-linux-s390x-gnu@0.158.0"
  - "@oxc-transform-react/binding-linux-x64-gnu@0.158.0"
  - "@oxc-transform-react/binding-linux-x64-musl@0.158.0"
  - "@oxc-transform-react/binding-openharmony-arm64@0.158.0"
  - "@oxc-transform-react/binding-win32-arm64-msvc@0.158.0"
  - "@oxc-transform-react/binding-win32-ia32-msvc@0.158.0"
  - "@oxc-transform-react/binding-win32-x64-msvc@0.158.0"
  - oxc-transform-react@0.158.0
  - fumadocs-core@16.19.7
  - knip@6.48.0
  - "@cloudflare/workers-utils@0.57.0"
  - "@voidzero-dev/vite-plus-core@8.3.8001"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.8.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.8.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.8.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.8.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.8.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.8.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.8.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.8.0"
  - lucide-react@1.79.0
  - miniflare@5.20261123.0-beta
  - vite-plus@1.8.0
  - wrangler@4.167.0
