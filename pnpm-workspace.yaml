packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  node-diff3: ^3.2.1
  # toolchain
  "@shadcn/lint": ^0.2.3
  "@types/node": ^24.19.2
  knip: ^6.43.0
  # Must match the oxfmt that vite-plus bundles, so generated files pass `vp check`.
  oxfmt: 0.74.0
  typescript: ^7.0.2
  ultracite: ^8.1.0
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0

  # cli
  "@clack/prompts": ^1.8.1
  citty: ^0.2.2
  execa: ^10.2.1
  jsonc-parser: ^3.3.1

  # generator
  "@types/semver": ^7.8.0
  es-toolkit: ^1.53.0
  semver: ^7.8.5
  zod: ^4.6.7

  # web
  "@inlang/paraglide-js": ^2.29.1
  "@inlang/paraglide-js-react": ^1.0.3
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-router": ^1.170.46
  "@tanstack/router-plugin": ^1.168.48
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.2
  motion: ^14.6.0
  oxc-transform-react: ^0.155.0
  react: 19.3.0
  react-dom: 19.3.0
  shiki: ^4.5.0
  tailwindcss: ^4.3.3
  wrangler: ^4.152.0

  # docs
  "@types/mdx": ^2.0.14
  fumadocs-core: ^16.17.8
  fumadocs-mdx: ^15.4.10

  # ui
  "@base-ui/react": ^1.9.0
  "@fontsource-variable/instrument-sans": ^5.3.0
  "@fontsource-variable/noto-serif-sc": ^5.3.1
  "@fontsource/dm-mono": ^5.3.0
  "@fontsource/instrument-serif": ^5.3.0
  class-variance-authority: ^0.7.1
  cn: ^0.5.0
  lucide-react: ^1.61.0
  shadcn: ^4.22.1
  tw-animate-css: ^1.4.0

overrides:
  vite@*: "catalog:"

allowBuilds:
  esbuild: false
  workerd: false

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

minimumReleaseAgeExclude:
  - ultracite@8.1.0
