packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  node-diff3: ^3.2.1
  # toolchain
  "@shadcn/lint": ^0.2.3
  "@types/node": ^24.19.2
  knip: ^6.43.0
  # Must match the oxfmt that vite-plus bundles, so generated files pass `vp check`.
  oxfmt: 0.74.0
  typescript: ^7.0.2
  ultracite: ^8.1.0
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0

  # cli
  "@clack/prompts": ^1.8.1
  citty: ^0.2.2
  execa: ^10.2.1
  jsonc-parser: ^3.3.1

  # generator
  "@types/semver": ^7.8.0
  es-toolkit: ^1.53.0
  semver: ^7.8.5
  zod: ^4.6.7

  # web
  "@inlang/paraglide-js": ^2.29.2
  "@inlang/paraglide-js-react": ^1.0.3
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-router": ^1.170.46
  "@tanstack/router-plugin": ^1.168.48
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.2
  motion: ^14.7.1
  oxc-transform-react: ^0.156.0
  react: 19.3.0
  react-dom: 19.3.0
  shiki: ^4.5.0
  tailwindcss: ^4.3.3
  wrangler: ^4.154.0

  # docs
  "@types/mdx": ^2.0.14
  fumadocs-core: ^16.17.8
  fumadocs-mdx: ^15.4.10

  # ui
  "@base-ui/react": ^1.9.0
  "@fontsource-variable/instrument-sans": ^5.3.0
  "@fontsource-variable/noto-serif-sc": ^5.3.1
  "@fontsource/dm-mono": ^5.3.0
  "@fontsource/instrument-serif": ^5.3.0
  class-variance-authority: ^0.7.1
  cn: ^0.5.0
  lucide-react: ^1.62.0
  shadcn: ^4.23.0
  tw-animate-css: ^1.4.0

overrides:
  vite@*: "catalog:"

allowBuilds:
  esbuild: false
  workerd: false

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

minimumReleaseAgeExclude:
  - ultracite@8.1.0
  - "@oxc-transform-react/binding-android-arm-eabi@0.156.0"
  - "@oxc-transform-react/binding-android-arm64@0.156.0"
  - "@oxc-transform-react/binding-darwin-arm64@0.156.0"
  - "@oxc-transform-react/binding-darwin-x64@0.156.0"
  - "@oxc-transform-react/binding-freebsd-x64@0.156.0"
  - "@oxc-transform-react/binding-linux-arm-gnueabihf@0.156.0"
  - "@oxc-transform-react/binding-linux-arm-musleabihf@0.156.0"
  - "@oxc-transform-react/binding-linux-arm64-gnu@0.156.0"
  - "@oxc-transform-react/binding-linux-arm64-musl@0.156.0"
  - "@oxc-transform-react/binding-linux-ppc64-gnu@0.156.0"
  - "@oxc-transform-react/binding-linux-riscv64-gnu@0.156.0"
  - "@oxc-transform-react/binding-linux-riscv64-musl@0.156.0"
  - "@oxc-transform-react/binding-linux-s390x-gnu@0.156.0"
  - "@oxc-transform-react/binding-linux-x64-gnu@0.156.0"
  - "@oxc-transform-react/binding-linux-x64-musl@0.156.0"
  - "@oxc-transform-react/binding-openharmony-arm64@0.156.0"
  - "@oxc-transform-react/binding-win32-arm64-msvc@0.156.0"
  - "@oxc-transform-react/binding-win32-ia32-msvc@0.156.0"
  - "@oxc-transform-react/binding-win32-x64-msvc@0.156.0"
  - "@shadcn/registry@0.2.1"
  - framer-motion@14.7.1
  - lucide-react@1.62.0
  - miniflare@5.20261023.1-beta
  - motion-dom@14.7.1
  - motion-utils@14.7.0
  - motion@14.7.1
  - oxc-transform-react@0.156.0
  - shadcn@4.23.0
  - wrangler@4.154.0
