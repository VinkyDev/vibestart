packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  node-diff3: ^3.2.1
  # toolchain
  "@shadcn/lint": ^0.2.5
  "@types/node": ^26.6.6
  knip: ^6.44.1
  # Must match the oxfmt that vite-plus bundles, so generated files pass `vp check`.
  oxfmt: 0.76.0
  typescript: ^7.0.2
  ultracite: ^8.1.1
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0

  # cli
  "@clack/prompts": ^1.8.1
  citty: ^0.2.2
  execa: ^10.2.1
  jsonc-parser: ^3.3.1

  # generator
  "@types/semver": ^7.8.0
  es-toolkit: ^1.53.1
  semver: ^7.8.6
  zod: ^4.6.7

  # web
  "@playwright/test": ^1.64.1
  "@inlang/paraglide-js": ^3.1.0
  "@inlang/paraglide-js-react": ^1.0.4
  "@tailwindcss/vite": ^4.3.4
  "@tanstack/react-router": ^1.170.46
  "@tanstack/router-plugin": ^1.168.48
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.2.1
  motion: ^14.9.1
  oxc-transform-react: ^0.157.0
  react: 19.3.0
  react-dom: 19.3.0
  shiki: ^4.6.0
  tailwindcss: ^4.3.4
  wrangler: ^4.157.0

  # docs
  "@types/mdx": ^2.0.14
  fumadocs-core: ^16.17.10
  fumadocs-mdx: ^15.4.10

  # ui
  "@base-ui/react": ^1.9.0
  "@fontsource-variable/instrument-sans": ^5.3.0
  "@fontsource-variable/noto-serif-sc": ^5.3.1
  "@fontsource/dm-mono": ^5.3.0
  "@fontsource/instrument-serif": ^5.3.0
  class-variance-authority: ^0.7.1
  cn: ^0.5.2
  lucide-react: ^1.69.0
  shadcn: ^4.23.0
  tw-animate-css: ^1.4.0

overrides:
  vite@*: "catalog:"

allowBuilds:
  esbuild: false
  workerd: false

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

minimumReleaseAgeExcludePrune: true

minimumReleaseAgeExclude:
  - lucide-react@1.69.0
