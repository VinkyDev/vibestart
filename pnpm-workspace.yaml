packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  node-diff3: ^3.2.1
  # toolchain
  "@shadcn/lint": ^0.2.1
  "@types/node": ^24.19.2
  knip: ^6.41.0
  # Must match the oxfmt that vite-plus bundles, so generated files pass `vp check`.
  oxfmt: 0.72.0
  typescript: ^7.0.2
  ultracite: ^8.0.1
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0

  # cli
  "@clack/prompts": ^1.8.1
  citty: ^0.2.2
  execa: ^10.1.1
  jsonc-parser: ^3.3.1

  # generator
  "@types/semver": ^7.8.0
  es-toolkit: ^1.52.0
  semver: ^7.8.5
  zod: ^4.6.7

  # web
  "@inlang/paraglide-js": ^2.27.0
  "@inlang/paraglide-js-react": ^1.0.3
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-router": ^1.170.44
  "@tanstack/router-plugin": ^1.168.45
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.2
  motion: ^14.2.0
  oxc-transform-react: ^0.154.0
  react: 19.3.0
  react-dom: 19.3.0
  shiki: ^4.5.0
  tailwindcss: ^4.3.3
  wrangler: ^4.150.0

  # docs
  "@types/mdx": ^2.0.14
  fumadocs-core: ^16.17.2
  fumadocs-mdx: ^15.4.7

  # ui
  "@base-ui/react": ^1.9.0
  "@fontsource-variable/instrument-sans": ^5.3.0
  "@fontsource-variable/noto-serif-sc": ^5.3.1
  "@fontsource/dm-mono": ^5.3.0
  "@fontsource/instrument-serif": ^5.3.0
  class-variance-authority: ^0.7.1
  cn: ^0.4.0
  lucide-react: ^1.56.0
  shadcn: ^4.21.4
  tw-animate-css: ^1.4.0

overrides:
  vite@*: "catalog:"

allowBuilds:
  esbuild: false
  workerd: false

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

minimumReleaseAgeExclude:
  - "@shikijs/core@4.5.0"
  - "@shikijs/engine-javascript@4.5.0"
  - "@shikijs/engine-oniguruma@4.5.0"
  - "@shikijs/langs@4.5.0"
