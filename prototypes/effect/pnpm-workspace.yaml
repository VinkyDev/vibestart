packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  # toolchain
  "@e2e-dev/web": ^0.15.2
  "@shadcn/lint": ^0.2.1
  "@types/node": ^24.19.2
  e2e: ^0.21.2
  knip: ^6.42.0
  typescript: ^7.0.2
  ultracite: ^8.0.1
  undici: ^8.12.2
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  # The Vitest that vite-plus 1.3.0 runs, so `@effect/vitest` registers tests with the same instance.
  vitest: 5.0.5

  # effect: every package of one release moves together, so each is pinned exactly.
  "@effect/atom-react": 4.0.5
  "@effect/platform-node": 4.0.5
  "@effect/sql-pg": 4.0.5
  "@effect/vitest": 4.0.5
  effect: 4.0.5

  # web
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-router": ^1.170.45
  "@tanstack/react-router-devtools": ^1.167.2
  "@tanstack/router-plugin": ^1.168.47
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.2
  es-toolkit: ^1.52.0
  next-themes: ^0.4.6
  oxc-transform-react: ^0.154.0
  react: 19.3.0
  react-dom: 19.3.0
  tailwindcss: ^4.3.3

  # ui
  "@base-ui/react": ^1.9.0
  "@fontsource-variable/geist": ^5.3.0
  class-variance-authority: ^0.7.1
  cn: ^0.5.0
  lucide-react: ^1.59.0
  shadcn: ^4.22.1
  sonner: ^2.0.8
  tw-animate-css: ^1.4.0

  # auth
  "@better-auth/drizzle-adapter": ^1.7.11
  better-auth: ^1.7.11

  # db: rc.4's `drizzle-orm/effect-postgres` fails to load on effect 4.0.5; this rc.5 snapshot loads.
  drizzle-kit: 1.0.0-rc.5-5935859
  drizzle-orm: 1.0.0-rc.5-5935859
  # Better Auth's Drizzle adapter takes the Promise driver (better-auth#7234).
  postgres: ^3.4.9

overrides:
  vite@*: "catalog:"

allowBuilds:
  esbuild: false

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
