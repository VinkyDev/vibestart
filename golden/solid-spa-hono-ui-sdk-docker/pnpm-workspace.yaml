packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  # toolchain
  "@playwright/test": ^1.65.1
  "@types/node": ^26.6.6
  knip: ^6.48.0
  typescript: ^7.0.2
  ultracite: ^8.3.1
  undici: ^8.13.1
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
  vite-plus: 1.8.0

  # web
  "@solidjs/router": 2.0.1
  "@solidjs/vite-plugin": 3.0.1
  "@solidjs/web": 2.0.4
  "@tailwindcss/vite": ^4.3.5
  es-toolkit: ^1.53.2
  solid-js: 2.0.4
  tailwindcss: ^4.3.5

  # ui
  "@ui-sdk/core": 0.1.0-beta.17
  "@ui-sdk/solid": 0.1.0-beta.17

  # api
  zod: ^4.6.7

  # server
  "@hono/node-server": ^2.1.11
  "@t3-oss/env-core": ^0.13.11
  hono: ^4.13.21

overrides:
  vite@*: "catalog:"

allowBuilds:
  esbuild: false

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
