  "@playwright/test": ^1.64.1
  "@shadcn/lint": ^0.2.5
  "@types/node": ^26.6.6
  knip: ^6.44.1
  typescript: ^7.0.2
  ultracite: ^8.1.1
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0

  # web
  "@tailwindcss/vite": ^4.3.4
  "@tanstack/react-query": ^5.106.0
  "@tanstack/react-query-devtools": ^5.106.0
  "@tanstack/react-router": ^1.170.46
  "@tanstack/react-router-devtools": ^1.167.2
  "@tanstack/router-plugin": ^1.168.48
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.2.1
  es-toolkit: ^1.53.1
  next-themes: ^0.4.6
  oxc-transform-react: ^0.157.0
  react: 19.3.0
  react-dom: 19.3.0
  tailwindcss: ^4.3.4

  # ui
  "@base-ui/react": ^1.9.0
  "@fontsource-variable/geist": ^5.3.0
  class-variance-authority: ^0.7.1
  cn: ^0.5.2
  lucide-react: ^1.69.0
  motion: ^14.9.1
  shadcn: ^4.23.0
  sonner: ^2.0.8
  tw-animate-css: ^1.4.0

  # server
  void: 1.6.2

overrides:
