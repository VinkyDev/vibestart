  "@playwright/test": ^1.65.0
  "@shadcn/lint": ^0.2.5
  "@types/node": ^26.6.6
  knip: ^6.44.2
  typescript: ^7.0.2
  ultracite: ^8.1.1
  vite: npm:@voidzero-dev/vite-plus-core@1.5.1
  vite-plus: 1.5.1

  # web
  "@tailwindcss/vite": ^4.3.5
  "@tanstack/react-query": ^5.107.1
  "@tanstack/react-query-devtools": ^5.107.1
  "@tanstack/react-router": ^1.170.46
  "@tanstack/react-router-devtools": ^1.167.3
  "@tanstack/router-plugin": ^1.169.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.3.0
  es-toolkit: ^1.53.2
  next-themes: ^0.4.6
  oxc-transform-react: ^0.158.0
  react: 19.3.0
  react-dom: 19.3.0
  tailwindcss: ^4.3.5

  # ui
  "@base-ui/react": ^1.9.0
  "@fontsource-variable/geist": ^5.3.0
  class-variance-authority: ^0.7.1
  cn: ^0.5.2
  lucide-react: ^1.71.0
  motion: ^14.11.1
  shadcn: ^4.23.0
  sonner: ^2.0.8
  tw-animate-css: ^1.4.0

  # server
  void: 1.7.0

overrides:
  vite@*: "catalog:"

allowBuilds:
  esbuild: false
  workerd: true

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
