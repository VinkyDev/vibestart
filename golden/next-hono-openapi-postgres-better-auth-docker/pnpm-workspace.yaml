packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  # toolchain
  "@playwright/test": ^1.63.0
  "@shadcn/lint": ^0.2.0
  "@types/node": ^24.19.1
  knip: ^6.39.0
  typescript: ^7.0.2
  ultracite: ^7.12.2
  undici: ^8.11.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0

  # web
  "@tailwindcss/postcss": ^4.3.3
  "@tanstack/react-query": ^5.104.1
  "@tanstack/react-query-devtools": ^5.104.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  babel-plugin-react-compiler: ^1.0.0
  es-toolkit: ^1.52.0
  next: ^16.3.8
  next-themes: ^0.4.6
  react: ^19.3.0
  react-dom: ^19.3.0
  server-only: ^0.0.1
  tailwindcss: ^4.3.3

  # ui
  "@base-ui/react": ^1.8.0
  "@fontsource-variable/geist": ^5.3.0
  class-variance-authority: ^0.7.1
  cn: ^0.4.0
  lucide-react: ^1.52.0
  shadcn: ^4.21.1
  sonner: ^2.0.8
  tw-animate-css: ^1.4.0

  # api
  "@hono/zod-openapi": ^1.6.3
  "@scalar/hono-api-reference": ^0.12.9
  zod: ^4.6.5

  # server
  "@hono/node-server": ^2.1.3
  "@t3-oss/env-core": ^0.13.11
  hono: ^4.13.13

  # auth
  "@better-auth/drizzle-adapter": ^1.7.7
  better-auth: ^1.7.7

  # db
  drizzle-kit: 1.0.0-rc.4
  drizzle-orm: 1.0.0-rc.4
  postgres: ^3.4.9

overrides:
  vite@*: "catalog:"

allowBuilds:
  esbuild: false
  sharp: false
  unrs-resolver: false

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
