packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  # toolchain
  "@playwright/test": ^1.65.1
  "@types/node": ^26.6.11
  knip: ^6.48.0
  typescript: ^7.0.2
  ultracite: ^8.3.1
  undici: ^8.13.1
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
  vite-plus: 1.8.0

  # web
  "@solidjs/router": 2.0.1
  "@solidjs/vite-plugin": 3.0.1
  "@solidjs/web": 2.0.4
  "@tailwindcss/vite": ^4.3.5
  es-toolkit: ^1.53.2
  solid-js: 2.0.4
  tailwindcss: ^4.3.5

  # ui
  "@ui-sdk/core": 0.1.0-beta.18
  "@ui-sdk/solid": 0.1.0-beta.18

  # api
  "@hono/zod-openapi": ^1.6.3
  "@scalar/hono-api-reference": ^0.12.26
  zod: ^4.6.7

  # server
  "@hono/node-server": ^2.1.11
  "@t3-oss/env-core": ^0.13.11
  hono: ^4.13.23

  # auth
  "@better-auth/drizzle-adapter": ^1.7.28
  better-auth: ^1.7.28

  # db
  drizzle-kit: 1.0.0-rc.6
  drizzle-orm: 1.0.0-rc.6
  postgres: ^4.1.1

overrides:
  vite@*: "catalog:"

allowBuilds:
  esbuild: false

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
