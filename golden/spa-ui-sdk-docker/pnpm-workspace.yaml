packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  # toolchain
  "@playwright/test": ^1.65.1
  "@types/node": ^26.6.6
  knip: ^6.48.0
  typescript: ^7.0.2
  ultracite: ^8.3.1
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
  vite-plus: 1.8.0

  # web
  "@tailwindcss/vite": ^4.3.5
  "@tanstack/react-query": ^5.108.4
  "@tanstack/react-query-devtools": ^5.108.4
  "@tanstack/react-router": ^1.170.46
  "@tanstack/react-router-devtools": ^1.167.4
  "@tanstack/router-plugin": ^1.169.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.3.0
  es-toolkit: ^1.53.2
  next-themes: ^0.4.6
  oxc-transform-react: ^0.158.0
  react: 19.3.0
  react-dom: 19.3.0
  tailwindcss: ^4.3.5

  # ui
  "@ui-sdk/core": 0.1.0-beta.17
  "@ui-sdk/react": 0.1.0-beta.17
  cn: ^0.5.2
  lucide-react: ^1.79.0
  motion: ^14.14.0
  sonner: ^2.0.8

overrides:
  vite@*: "catalog:"

allowBuilds:
  esbuild: false

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
