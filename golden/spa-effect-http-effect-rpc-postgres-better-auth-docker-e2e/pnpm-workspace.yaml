  "@e2e-dev/web": ^0.15.3
  "@shadcn/lint": ^0.2.3
  "@types/node": ^26.6.6
  e2e: ^0.21.3
  knip: ^6.43.0
  typescript: ^7.0.2
  ultracite: ^8.1.0
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0

  # effect
  "@effect/atom-react": 4.1.0
  "@effect/platform-node": 4.1.0
  "@effect/sql-pg": 4.1.0
  "@effect/vitest": 4.1.0
  effect: 4.1.0
  vitest: 5.0.5

  # web
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-router": ^1.170.46
  "@tanstack/react-router-devtools": ^1.167.2
  "@tanstack/router-plugin": ^1.168.48
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
