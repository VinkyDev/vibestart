  # ui
  "@base-ui/react": ^1.9.0
  "@fontsource-variable/geist": ^5.3.0
  class-variance-authority: ^0.7.1
  cn: ^0.5.0
  lucide-react: ^1.62.0
  shadcn: ^4.23.0
  sonner: ^2.0.8
  tw-animate-css: ^1.4.0

  # auth
  "@better-auth/drizzle-adapter": ^1.7.14
  better-auth: ^1.7.14

  # db
  drizzle-kit: 1.0.0-rc.5
  drizzle-orm: 1.0.0-rc.5
  postgres: ^3.4.9

overrides:
  vite@*: "catalog:"

allowBuilds:
  esbuild: false

peerDependencyRules:
