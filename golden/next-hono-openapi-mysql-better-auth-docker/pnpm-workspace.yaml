packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  # toolchain
  "@playwright/test": ^1.65.1
  "@shadcn/lint": ^0.2.5
  "@types/node": ^26.6.11
  knip: ^6.48.0
  typescript: ^7.0.2
  ultracite: ^8.3.1
  undici: ^8.13.1
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
  vite-plus: 1.8.0

  # web
  "@tailwindcss/postcss": ^4.3.5
  "@tanstack/react-query": ^5.108.4
  "@tanstack/react-query-devtools": ^5.108.4
  "@types/react": ^19.3.3
  "@types/react-dom": ^19.3.0
  babel-plugin-react-compiler: ^1.0.0
  es-toolkit: ^1.53.2
  next: ^16.4.6
  next-themes: ^0.4.6
  react: 19.3.0
  react-dom: 19.3.0
  server-only: ^0.0.1
  tailwindcss: ^4.3.5

  # ui
  "@base-ui/react": ^1.9.0
  "@fontsource-variable/geist": ^5.3.0
  class-variance-authority: ^0.7.1
  cn: ^0.5.2
  lucide-react: ^1.81.0
  motion: ^14.14.0
  shadcn: ^4.23.1
  sonner: ^2.0.8
  tw-animate-css: ^1.4.0

  # api
  "@hono/zod-openapi": ^1.6.3
  "@scalar/hono-api-reference": ^0.12.26
  zod: ^4.6.7

  # server
  "@hono/node-server": ^2.1.11
  "@t3-oss/env-core": ^0.13.11
  hono: ^4.13.23

  # auth
  "@better-auth/drizzle-adapter": ^1.7.28
  better-auth: ^1.7.28

  # db
  drizzle-kit: 1.0.0-rc.6
  drizzle-orm: 1.0.0-rc.6
  mysql2: ^3.24.6

overrides:
  vite@*: "catalog:"

allowBuilds:
  esbuild: false
  sharp: false
  unrs-resolver: false

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
