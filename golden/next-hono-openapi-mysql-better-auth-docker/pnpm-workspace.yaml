packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  # toolchain
  "@playwright/test": ^1.64.1
  "@shadcn/lint": ^0.2.3
  "@types/node": ^26.6.6
  knip: ^6.44.1
  typescript: ^7.0.2
  ultracite: ^8.1.0
  undici: ^8.12.3
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0

  # web
  "@tailwindcss/postcss": ^4.3.3
  "@tanstack/react-query": ^5.105.1
  "@tanstack/react-query-devtools": ^5.105.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  babel-plugin-react-compiler: ^1.0.0
  es-toolkit: ^1.53.1
  next: ^16.4.3
  next-themes: ^0.4.6
  react: 19.3.0
  react-dom: 19.3.0
  server-only: ^0.0.1
  tailwindcss: ^4.3.3

  # ui
  "@base-ui/react": ^1.9.0
  "@fontsource-variable/geist": ^5.3.0
  class-variance-authority: ^0.7.1
  cn: ^0.5.1
  lucide-react: ^1.66.0
  shadcn: ^4.23.0
  sonner: ^2.0.8
  tw-animate-css: ^1.4.0

  # api
  "@hono/zod-openapi": ^1.6.3
  "@scalar/hono-api-reference": ^0.12.17
  zod: ^4.6.7

  # server
  "@hono/node-server": ^2.1.5
  "@t3-oss/env-core": ^0.13.11
  hono: ^4.13.16

  # auth
  "@better-auth/drizzle-adapter": ^1.7.15
  better-auth: ^1.7.15

  # db
  drizzle-kit: 1.0.0-rc.5
  drizzle-orm: 1.0.0-rc.5
  mysql2: ^3.24.6

overrides:
  vite@*: "catalog:"

allowBuilds:
  esbuild: false
  sharp: false
  unrs-resolver: false

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
