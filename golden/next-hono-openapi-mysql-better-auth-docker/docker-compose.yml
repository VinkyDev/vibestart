name: my-app

x-app: &app
  build: .
  image: my-app
  environment:
    DATABASE_URL: mysql://root:mysql@db:3306/my_app
    BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
    BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: my_app
      MYSQL_ROOT_PASSWORD: mysql
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pmysql"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db-data:/var/lib/mysql

  migrate:
    <<: *app
    command: ["node", "dist/migrate.mjs"]
    depends_on:
      db:
        condition: service_healthy

  server:
    <<: *app
    command: ["node", "dist/index.mjs"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  app:
    <<: *app
    environment:
      SERVER_URL: http://server:3000
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  db-data:
